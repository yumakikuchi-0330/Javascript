<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>JavaScript課題3</title>
    </head>
    <body>
        <form id="myForm">
            <div>
                <label>名前: <input type="text" id="nameInput" /></label>
                <p class="error" id="nameError" style="color: red; display: none;">正しい名前を入力してください</p>
            </div>
            <div>
                <label>年齢: <input type="text" id="ageInput"></label>
                <p class="error" id="ageError" style="color: red;">正しい年齢を入力してください</p>
            </div>
            <div>
                <label>メール: <input type="text" id="emailInput"></label>
                <p class="error" id="emailError" style="color: red;">正しいメールアドレスを入力してください</p>
            </div>
            <div>
                <label>電話番号: <input type="text" id="phoneInput" placeholder="ハイフンなし"></label>
                <p class="error" id="phoneError" style="color: red;">正しい電話番号を入力してください</p>
            </div>
            <button type="button" id="button">送信</button>
        </form>
        <script src="practice3.js"></script>
    </body>
</html>
